---
configuration:
  name: "Security Baseline Configuration"
  description: "Standard security hardening configuration for network devices"
  version: "2.1.0"
  created_by: "Security Team"
  compliance_standards:
    - "ISO 27001"
    - "NIST Cybersecurity Framework"
    - "CIS Controls"

# Authentication and Authorization
authentication:
  local_users:
    - username: "admin"
      privilege_level: 15
      password_policy: "complex"
      role: "network-admin"
    - username: "operator"
      privilege_level: 1
      password_policy: "complex"
      role: "network-operator"
  
  aaa:
    enabled: true
    authentication_methods:
      - "local"
      - "radius"
    authorization:
      enabled: true
      default_role: "network-operator"
    accounting:
      enabled: true
      log_level: "commands"

# SSH Configuration
ssh:
  version: 2
  enabled: true
  port: 22
  timeout: 300
  max_sessions: 5
  max_auth_tries: 3
  login_grace_time: 60
  permit_root_login: false
  password_authentication: false
  public_key_authentication: true
  host_key_algorithms:
    - "rsa"
    - "ecdsa"
    - "ed25519"
  ciphers:
    - "aes256-ctr"
    - "aes192-ctr"
    - "aes128-ctr"
  mac_algorithms:
    - "hmac-sha2-256"
    - "hmac-sha2-512"

# SNMP Configuration
snmp:
  version: 3
  community_strings:
    read_only: null  # Disabled for security
    read_write: null # Disabled for security
  v3_users:
    - username: "monitor"
      auth_protocol: "SHA"
      auth_password: "{{ snmp_auth_password }}"
      priv_protocol: "AES"
      priv_password: "{{ snmp_priv_password }}"
      access_level: "read-only"
  trap_destinations:
    - host: "192.168.1.100"
      port: 162
      version: 3
      user: "monitor"

# Password Policy
password_policy:
  min_length: 12
  max_length: 128
  complexity_requirements:
    uppercase: true
    lowercase: true
    numbers: true
    special_characters: true
  history_count: 12
  max_age_days: 90
  min_age_days: 1
  warning_days: 14
  lockout_threshold: 5
  lockout_duration: 30

# Network Security
network_security:
  disable_unused_services:
    - "telnet"
    - "http"
    - "finger"
    - "echo"
    - "discard"
    - "chargen"
  
  enable_secure_services:
    - "https"
    - "ssh"
    - "ntp"
  
  access_control_lists:
    management_acl:
      name: "MGMT-ACCESS"
      rules:
        - action: "permit"
          protocol: "tcp"
          source: "192.168.1.0/24"
          destination: "any"
          port: 22
        - action: "permit"
          protocol: "tcp"
          source: "192.168.1.0/24"
          destination: "any"
          port: 443
        - action: "deny"
          protocol: "any"
          source: "any"
          destination: "any"

# Logging Configuration
logging:
  enabled: true
  level: "informational"
  buffer_size: 65536
  console_logging: false
  monitor_logging: true
  file_logging:
    enabled: true
    max_size: "100MB"
    rotation_count: 10
  
  syslog_servers:
    - host: "192.168.1.100"
      port: 514
      facility: "local0"
      severity: "informational"
      protocol: "tcp"
  
  audit_logging:
    enabled: true
    events:
      - "login_attempts"
      - "privilege_escalation"
      - "configuration_changes"
      - "interface_state_changes"

# Time Synchronization
ntp:
  enabled: true
  servers:
    - "192.168.1.10"
    - "192.168.1.11"
  authentication:
    enabled: true
    key_id: 1
    key_value: "{{ ntp_auth_key }}"
  access_control:
    restrict_default: "nomodify notrap nopeer noquery"
    allow_servers:
      - "192.168.1.0/24"

# Certificate Management
certificates:
  ca_certificate:
    name: "TejasRootCA"
    path: "/etc/ssl/certs/tejas-root-ca.pem"
  
  device_certificate:
    name: "device-cert"
    key_size: 2048
    validity_days: 365
    subject:
      country: "IN"
      state: "Karnataka"
      city: "Bangalore"
      organization: "Tejas Networks"
      organizational_unit: "Network Operations"

# Interface Security
interface_security:
  default_settings:
    shutdown_unused: true
    storm_control:
      broadcast_threshold: 5
      multicast_threshold: 5
      unicast_threshold: 5
    port_security:
      enabled: true
      max_addresses: 2
      violation_action: "shutdown"
      aging_time: 1440
  
  management_interface:
    access_list: "MGMT-ACCESS"
    rate_limit: 100

# Security Monitoring
security_monitoring:
  intrusion_detection:
    enabled: true
    sensitivity: "medium"
    actions:
      - "log"
      - "snmp_trap"
  
  anomaly_detection:
    enabled: true
    baseline_learning_period: 168  # hours
    threshold_deviation: 20  # percentage
  
  threat_intelligence:
    enabled: true
    feeds:
      - "internal_blacklist"
      - "industry_threat_feeds"

# Backup and Recovery
backup:
  automatic_backup:
    enabled: true
    frequency: "daily"
    retention_days: 30
    encryption: true
  
  backup_locations:
    - type: "sftp"
      host: "backup.tejas.local"
      path: "/network-configs"
      credentials: "{{ backup_credentials }}"

# Compliance Checks
compliance:
  automated_checks:
    enabled: true
    frequency: "weekly"
    report_destination: "security@tejas.com"
  
  required_configurations:
    - "ssh_v2_only"
    - "no_telnet"
    - "encrypted_passwords"
    - "ntp_configured"
    - "logging_configured"
    - "snmp_v3_only"

# Template Variables (for use with configuration templates)
template_variables:
  - name: "management_vlan"
    type: "integer"
    default: 10
    description: "Management VLAN ID"
  
  - name: "snmp_auth_password"
    type: "string"
    secure: true
    description: "SNMP v3 authentication password"
  
  - name: "snmp_priv_password"
    type: "string"
    secure: true
    description: "SNMP v3 privacy password"
  
  - name: "ntp_auth_key"
    type: "string"
    secure: true
    description: "NTP authentication key"